<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="face" cx="32" cy="36" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Stem -->
  <rect x="28" y="8" width="8" height="6" rx="1.5" fill="#ffffff"/>
  <!-- Side button -->
  <rect x="44" y="12" width="6" height="4" rx="1.5" fill="#ffffff" transform="rotate(35 47 14)"/>

  <!-- Watch face -->
  <circle cx="32" cy="38" r="20" fill="url(#face)" stroke="#ffffff" stroke-width="2"/>

  <!-- Tick marks (12, 3, 6, 9) -->
  <g fill="#7c3aed">
    <rect x="31" y="20" width="2" height="4" rx="1"/>
    <rect x="46" y="37" width="4" height="2" rx="1"/>
    <rect x="31" y="52" width="2" height="4" rx="1"/>
    <rect x="14" y="37" width="4" height="2" rx="1"/>
  </g>

  <!-- Clock hand pointing to ~2 o'clock -->
  <line x1="32" y1="38" x2="44" y2="28" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>

  <!-- Center pin -->
  <circle cx="32" cy="38" r="2.5" fill="#7c3aed"/>
  <circle cx="32" cy="38" r="1" fill="#ffffff"/>
</svg>
